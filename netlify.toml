# Netlify serves the finished site from the site/ folder.
# The site is built on your computer or by Claude (python3 tools/build.py) and committed,
# so Netlify has nothing to build; it just publishes.
[build]
  publish = "site"
  command = ""

# One small function: relays anonymous alignment-test answers into the "alignment-stats" form,
# so Netlify stores the answers without the visitor's IP address.
[functions]
  directory = "netlify/functions"
